{% extends 'base.html' %}
{% block content %}
<div class="d-flex h-100 bg-light py-5">
    <form class="container-fluid m-auto bg-white p-5 border rounded" method="POST" style="max-width: 30rem;">
        <h4 class="mb-4 text-center">Вход в систему</h4>
        <div class="form-floating mb-3">
            <input autocomplete="off" type="text" class="form-control" name="login" id="login"
                placeholder="login" value="{{ request.form.get('login', '') }}" required>
            <label for="login">Логин</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password">
            <label for="password">Пароль</label>
        </div>
        <button type="submit" class="btn btn-dark w-100">Войти</button>
    </form>
</div>
{% endblock %}
